<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcnePredict Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Використовуємо вторинний фон для країв */
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            /* Основний колір тексту від Телеграму */
            color: var(--tg-theme-text-color, #222);
            padding: 20px;
            margin: 0;
        }
        .card {
            /* Фон картки тепер адаптивний (чорний в темній темі, білий у світлій) */
            background-color: var(--tg-theme-bg-color, #ffffff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .slider-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; }
        /* Зробив значення повзунків адаптивними, щоб не зливалися */
        .val-display { color: var(--tg-theme-hint-color, #8B3A3A); font-weight: bold; float: right; }
        
        #result-panel {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            color: white; /* Цей текст завжди білий, бо фон кольоровий */
            background: #4A192C;
        }
        .prob-num { font-size: 52px; font-weight: 800; margin: 10px 0; }
        .rec-text { font-size: 16px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top: 0;">AcnePredict MVP</h2>
        
        <div class="slider-group">
            <label>C.acnes / S.epidermidis Ratio <span class="val-display" id="r-val">2.5</span></label>
            <input type="range" id="ratio" min="0.1" max="10.0" step="0.1" value="2.5">
        </div>

        <div class="slider-group">
            <label>Рівень pH шкіри <span class="val-display" id="ph-val">5.5</span></label>
            <input type="range" id="ph" min="4.0" max="8.0" step="0.1" value="5.5">
        </div>

        <div class="slider-group">
            <label>Індекс Шеннона (Alpha-diversity) <span class="val-display" id="sh-val">3.0</span></label>
            <input type="range" id="shannon" min="1.0" max="5.0" step="0.1" value="3.0">
        </div>

        <div id="result-panel">
            <div style="opacity: 0.8;">Ймовірність успіху (AUC-базована):</div>
            <div class="prob-num" id="prob">--%</div>
            <div class="rec-text" id="rec">Аналіз параметрів...</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const ratioS = document.getElementById('ratio');
        const phS = document.getElementById('ph');
        const shS = document.getElementById('shannon');

        function update() {
            let r = parseFloat(ratioS.value);
            let ph = parseFloat(phS.value);
            let sh = parseFloat(shS.value);

            document.getElementById('r-val').innerText = r;
            document.getElementById('ph-val').innerText = ph;
            document.getElementById('sh-val').innerText = sh;

            let score = 50 + (sh * 10) - (r * 4) - (Math.abs(5.5 - ph) * 12);
            let final = Math.max(5, Math.min(98, Math.round(score)));

            document.getElementById('prob').innerText = final + '%';

            let panel = document.getElementById('result-panel');
            let rec = document.getElementById('rec');

            if(final > 75) {
                panel.style.background = "#2E8B57";
                rec.innerText = "Висока чутливість до терапії";
            } else if(final > 45) {
                panel.style.background = "#DAA520";
                rec.innerText = "Помірна відповідь, можливі рецидиви";
            } else {
                panel.style.background = "#8B3A3A";
                rec.innerText = "Високий ризик резистентності";
            }
        }

        [ratioS, phS, shS].forEach(s => s.addEventListener('input', update));
        update();
    </script>
</body>
</html>
